name: Setup vcpkg
description: Install CMake/Ninja, restore the vcpkg binary cache, and set up vcpkg.

inputs:
  cache-prefix:
    description: Cache key namespace (test jobs use a separate namespace from build/release).
    required: false
    default: vcpkg

runs:
  using: composite
  steps:
    - name: Install CMake and Ninja
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

    - name: Restore vcpkg binary cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: C:\vcpkg-cache
        key: ${{ inputs.cache-prefix }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**', 'cmake/ports/**') }}
        restore-keys: ${{ inputs.cache-prefix }}-

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
      with:
        vcpkgDirectory: ${{ github.workspace }}/lib/vcpkg
      env:
        VCPKG_BINARY_SOURCES: "clear;files,C:\\vcpkg-cache,readwrite"
