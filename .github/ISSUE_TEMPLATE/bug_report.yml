name: Bug Report
description: Report a bug or unexpected behaviour
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
    validations:
      required: true

  - type: textarea
    id: crash_log
    attributes:
      label: Crash Log
      description: |
        If Skyrim crashed to desktop, install [Crash Logger SSE](https://www.nexusmods.com/skyrimspecialedition/mods/59596),
        reproduce the crash, then paste or attach the newest `crash-*.log` from
        `Documents/My Games/Skyrim Special Edition/SKSE` (`Skyrim Special Edition GOG` on GOG).
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Skyrim version, SKSE version, other relevant mods.
    validations:
      required: false
