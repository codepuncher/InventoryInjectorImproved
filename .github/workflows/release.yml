name: Release
run-name: Release ${{ inputs.bump }}${{ inputs.kind == 'test' && ' (test)' || '' }}

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "release publishes to GitHub and Nexus; test publishes a GitHub prerelease only"
        type: choice
        options:
          - release
          - test
        default: release
      bump:
        description: "patch, minor, major, or X.Y.Z"
        type: string
        default: patch
      label:
        description: "Test builds only: tag suffix, e.g. vr-support"
        type: string
        default: test

permissions: {}

concurrency:
  group: ${{ inputs.kind == 'release' && 'release' || github.run_id }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write
      actions: write

    steps:
      - name: Check branch
        if: inputs.kind == 'release' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo 'Error: releases must run from main; use kind=test for other branches' >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          submodules: recursive

      - name: Determine version
        id: version
        shell: bash
        env:
          KIND: ${{ inputs.kind }}
          BUMP: ${{ inputs.bump }}
          LABEL: ${{ inputs.label }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BASE=$(bash scripts/next-version.sh "${BUMP}")
          if [[ "${KIND}" == "release" ]]; then
            VALUE="${BASE}"
            BUILD="${BASE}"
          else
            if [[ ! "${LABEL}" =~ ^[a-z0-9-]+$ ]]; then
              echo "Error: label must match [a-z0-9-]+, got '${LABEL}'" >&2
              exit 1
            fi
            VALUE="${BASE}-${LABEL}.${RUN_NUMBER}"
            # The co-save stamp packs the fourth component into 8 bits.
            BUILD="${BASE}.$((RUN_NUMBER % 255 + 1))"
          fi
          {
            echo "previous=$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
            echo "build=${BUILD}"
            echo "value=${VALUE}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4

      - name: Restore vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json', 'cmake/triplets/**', 'cmake/ports/**') }}
          restore-keys: vcpkg-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: ${{ github.workspace }}/lib/vcpkg
        env:
          VCPKG_BINARY_SOURCES: "clear;files,C:\\vcpkg-cache,readwrite"

      - name: Configure and Build
        uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
        with:
          configurePreset: release-windows
          configurePresetAdditionalArgs: "['-DI5_VERSION=${{ steps.version.outputs.build }}']"
          buildPreset: release-windows
        env:
          VCPKG_BINARY_SOURCES: "clear;files,C:\\vcpkg-cache,readwrite"

      - name: Package
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: bash scripts/package.sh --build-dir build/msvc "$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.kind == 'test' }}
          make_latest: ${{ inputs.kind == 'release' }}
          previous_tag: ${{ steps.version.outputs.previous }}
          files: |
            ${{ steps.package.outputs.zip }}
            build/msvc/*.pdb
          generate_release_notes: true
